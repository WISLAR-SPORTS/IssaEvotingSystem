{% extends "base.html" %}

{% block content %}

<div class="election-schedule-wrapper d-flex justify-content-center align-items-center">

    <div class="card election-schedule-card shadow-lg border-0 text-center">

        <!-- Icon -->
        <div class="mb-4">
            <div class="election-schedule-icon">
                ⏳
            </div>
        </div>

        <!-- Title -->
        <h3 class="fw-bold mb-2">Election Scheduled</h3>

        <!-- Subtitle -->
        <p class="text-muted mb-4">
            <strong>{{ election.name }}</strong> has not started yet.
        </p>

        <!-- Countdown -->
        <div class="countdown-box p-3 mb-4 rounded">
            <p class="mb-1 text-muted small">Starts in</p>
            <h5 class="mb-0 fw-bold">
                {{ election.start_time|timeuntil }}
            </h5>
        </div>

        <!-- Date -->
        <p class="small text-muted mb-4">
            Scheduled for {{ election.start_time|date:"M d, Y - H:i" }}
        </p>

        <!-- CTA -->
        <a href="{% url 'elections:positions_list' %}" 
           class="btn btn-primary w-100 w-sm-auto px-4 py-2">
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">

    <div class="card shadow-lg border-0 text-center p-5" 
         style="max-width: 520px; width: 100%; border-radius: 16px;">

        <!-- Icon -->
        <div class="mb-4">
            <div style="
                width: 80px;
                height: 80px;
                margin: 0 auto;
                border-radius: 50%;
                background: linear-gradient(135deg, #0d6efd, #6ea8fe);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 32px;
                color: white;
            ">
                ⏳
            </div>
        </div>

        <!-- Title -->
        <h3 class="fw-bold mb-2">Election Scheduled</h3>

        <!-- Subtitle -->
        <p class="text-muted mb-4">
            <strong>{{ election.name }}</strong> has not started yet.
        </p>

        <!-- Countdown -->
        <div class="p-3 mb-4 rounded" style="background: #f8f9fa;">
            <p class="mb-1 text-muted small">Starts in</p>
            <h5 class="mb-0 fw-bold">
                {{ election.start_time|timeuntil }}
            </h5>
        </div>

        <!-- Exact date -->
        <p class="small text-muted mb-4">
            Scheduled for {{ election.start_time|date:"M d, Y - H:i" }}
        </p>

        <!-- CTA -->
        <a href="{% url 'elections:positions_list' %}" 
           class="btn btn-primary px-4 py-2">
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}

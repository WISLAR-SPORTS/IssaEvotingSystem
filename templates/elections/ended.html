{% extends "base.html" %}

{% block content %}

<div class="election-wrapper d-flex justify-content-center align-items-center">

    <div class="card election-card shadow-lg border-0 text-center">

        <!-- Icon -->
        <div class="mb-4">
            <div class="election-icon">
                ❌
            </div>
        </div>

        <!-- Title -->
        <h3 class="mb-3 fw-bold">Election Closed</h3>

        <!-- Description -->
        <p class="text-muted mb-4">
            The election for <strong>{{ election.name }}</strong> has officially ended.
        </p>

        <!-- Optional extra info -->
        <p class="small text-muted">
            Voting is no longer available. Results may be announced soon.
        </p>

        <!-- Button -->
        <div class="mt-4">
            <a href="{% url 'elections:positions_list' %}" class="btn btn-dark px-4 py-2 w-100 w-sm-auto">
                Back to Positions
            </a>
        </div>

    </div>

</div>

{% endblock %}

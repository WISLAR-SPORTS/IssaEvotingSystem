{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/request.css' %}">
</head>

<body>

<div class="container">
    <div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">

        <div class="card shadow-lg border-0 p-4" style="max-width:420px; width:100%;">

            <div class="text-center mb-3">
                <h4 class="fw-bold">Reset Password</h4>
                <p class="text-muted small">Enter your email to receive a verification code</p>
            </div>

            <form id="emailForm">
                {% csrf_token %}

                <div class="mb-3">
                    <input name="email"
                           id="emailInput"
                           class="form-control form-control-lg"
                           placeholder="Enter your email"
                           required>
                </div>

                <div id="emailError" class="text-danger small mb-2"></div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    Send OTP
                </button>

            </form>

        </div>

    </div>
</div>


<!-- OTP MODAL -->
<div class="modal fade" id="otpModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">

            <div class="text-center mb-3">
                <h4 class="fw-bold">Verify OTP</h4>
                <p class="text-muted small">Enter the code sent to your email now </p>
            </div>

            <form id="otpForm">
                {% csrf_token %}

                <input name="code"
                       id="otpInput"
                       class="form-control form-control-lg text-center fw-bold"
                       placeholder="Enter OTP"
                       maxlength="6">

                <div id="otpError" class="text-danger small mt-2"></div>

                <button class="btn btn-success w-100 btn-lg mt-3">
                    Verify Code
                </button>

            </form>

        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- AJAX LOGIC -->
<script>
document.getElementById("emailForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("emailInput").value;
    const errorDiv = document.getElementById("emailError");

    errorDiv.innerText = "";

    const response = await fetch("", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify({ email: email })
    });

    const data = await response.json();

    if (data.success) {
        var modal = new bootstrap.Modal(document.getElementById('otpModal'));
        modal.show();
    } else {
        errorDiv.innerText = data.error;
    }
});


document.getElementById("otpForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const code = document.getElementById("otpInput").value;
    const errorDiv = document.getElementById("otpError");

    errorDiv.innerText = "";

    const response = await fetch("{% url 'accounts:verify_otp' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": document.querySelectorAll('[name=csrfmiddlewaretoken]')[0].value
        },
        body: JSON.stringify({ code: code })
    });

    const data = await response.json();

    if (data.success) {
        window.location.href = "{% url 'accounts:set_new_password' %}";
    } else {
        errorDiv.innerText = data.error;
    }
});
</script>

</body>
</html>

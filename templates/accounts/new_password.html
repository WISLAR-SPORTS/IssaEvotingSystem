{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/new.css' %}">
</head>

<body>

<div class="container">
    <div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">

        <div class="card shadow-lg border-0 p-4" style="max-width:420px; width:100%;">

            <div class="text-center mb-3">
                <h4 class="fw-bold">Set New Password</h4>
                <p class="text-muted small">Choose a strong password</p>
            </div>

            <form id="passwordForm">
                {% csrf_token %}
            
                <div class="mb-3 position-relative">
            
                    <input name="password"
                           id="passwordInput"
                           type="password"
                           class="form-control form-control-lg pe-5"
                           placeholder="New Password"
                           required>
            
                    <!-- Eye Button -->
                    <span id="togglePassword"
                          style="position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer;">
                        👁️
                    </span>
            
                </div>
            
                <div id="passwordError" class="text-danger small mb-2"></div>
            
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    Update Password
                </button>
            </form>

            </form>

        </div>

    </div>
</div>

<!-- JS --><script>
document.getElementById("passwordForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const password = document.getElementById("passwordInput").value;
    const errorDiv = document.getElementById("passwordError");

    errorDiv.innerText = "";

    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

    try {
        const response = await fetch("{% url 'accounts:set_new_password' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify({ password: password })
        });

        const data = await response.json();

        if (data.success) {
            window.location.href = "{% url 'accounts:login' %}";
        } else {
            errorDiv.innerText = data.error || "Something went wrong";
        }

    } catch (err) {
        errorDiv.innerText = "Network error. Check console.";
        console.error(err);
    }
});
</script>
<script>
    document.getElementById("togglePassword").addEventListener("click", function () {
        const passwordInput = document.getElementById("passwordInput");
    
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            this.textContent = "🙈";
        } else {
            passwordInput.type = "password";
            this.textContent = "👁️";
        }
    });
    </script>
</body>
</html>

<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">

    <div class="card shadow-lg border-0 p-4 text-center" style="max-width:420px; width:100%; border-radius:16px;">

        <h4 class="fw-bold">Verify OTP</h4>
        <p class="text-muted small">Enter the code sent to your email</p>

        <form method="POST">
            {% csrf_token %}

            <input name="code"
                   class="form-control form-control-lg text-center fw-bold"
                   placeholder="Enter OTP"
                   maxlength="6"
                   style="letter-spacing:6px; font-size:20px;">

            <button class="btn btn-success w-100 btn-lg mt-3">
                Verify Code
            </button>
            <p class="mt-3">
                Didn't receive code?
                <a href="{% url 'accounts:request_password_reset' %}">Get another code</a>
            </p>

        </form>

        <p class="text-muted small mt-3">
            Didn’t receive code? <a href="#">Resend</a>
        </p>

    </div>

</div>
